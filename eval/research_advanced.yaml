# Advanced research suite: multi-step workflows (Phase D), finer geography
# (Phase E), and spatial methods (Phase F). Same format and scorer as
# research.yaml, which stays fixed so its baselines remain comparable.
#
#   python eval/answer_probe.py --suite-file eval/research_advanced.yaml --check-gold
#   python eval/answer_probe.py --suite-file eval/research_advanced.yaml --self-test
#   python eval/answer_probe.py --suite-file eval/research_advanced.yaml --endpoint research \
#       --save eval/advanced/r1.json
#
# Written 2026-11-11 from the outside, as a county health officer, a planner or
# a graduate student would ask, WITHOUT checking the op list: several need
# capabilities that do not exist yet, and their failure is the baseline. The
# tier says which phase a question is waiting on:
#
#   phase_d   needs several analyses where a later one uses an earlier one's
#             result ("those counties", "of those", "the rest of the country")
#   phase_e   needs a unit other than the county: tract, ZIP (ZCTA), grid cell,
#             or a crosswalk between them
#   phase_f   needs a spatial method: catchment population, two-step floating
#             catchment access, neighbour comparison, regression residuals,
#             change between years, margins of error
#   refuse    must not be answered
#
# Gold below the county level (Phase E) is keyed by the unit's geoid in the
# `fips` column, via {geo:<level>:m1}: geo_values at that level, latest year.
# The probe accepts answer rows keyed `fips` or `geoid`.
#
# Distances in gold are brute-force geodesic (or the same exact bound the op
# uses), never a single <-> KNN, which is wrong for 6.9% of counties.
#
# Every gold has been run (--check-gold) and fed back to the scorer
# (--self-test) before any API run. Each `note` says what a careful analyst
# would expect, so a failure can be classified rather than just counted.

regions:
  midwest: ['17','18','19','20','26','27','29','31','38','39','46','55']

measures:
  poverty_rate: '^(DP03_0128PE|PCTPOVALL)\b'
  # SVI_E_TOTPOP (ACS 2018-22, restored to the catalog 2026-11-11): median
  # ratio 0.997 to POP_ESTIMATE, but 95 of 3,133 counties off >10% (5-year
  # ACS against a 2023 estimate). A defensible total population; accepted.
  population: '^(DP05_0001E|POP_ESTIMATE|CHR_V051_RAWVALUE|SVI_E_TOTPOP)\b'
  income: '^(DP03_0062E|MEDHHINC|CHR_V063_RAWVALUE|MEDIAN_HOUSEHOLD_INCOME)\b'
  uninsured_rate: '^(DP03_0099PE|CHR_V085_RAWVALUE|SVI_EP_UNINSUR)\b'
  diabetes: '^(PLACES_DIABETES_(CrdPrv|AgeAdjPrv)|CHR_V060_RAWVALUE)\b'
  asthma: '^PLACES_CASTHMA_(CrdPrv|AgeAdjPrv)\b'
  smoking: '^(PLACES_CSMOKING_(CrdPrv|AgeAdjPrv)|CHR_V009_RAWVALUE)\b'
  copd: '^PLACES_COPD_(CrdPrv|AgeAdjPrv)\b'
  unemployment_rate: '^(UNEMPLOYMENT_RATE|DP03_0009PE|SVI_EP_UNEMP)\b'
  unemployment_yearly: '^UNEMPLOYMENT_RATE\b'
  hospitals: '_hospitals\b'
  fire_stations: '_fire_stations\b'
  # Phase E: measures loaded below the county level (geo_measure).
  pov150: '^SVI_EP_POV150\b'
  noveh: '^SVI_EP_NOVEH\b'
  uninsured_tract: '^SVI_EP_UNINSUR\b'
  unit_population: '^(SVI_E_TOTPOP|WORLDPOP_POP)\b'
  worldpop: '^WORLDPOP_POP\b'
  diabetes_zip: '^PLACES_DIABETES_CrdPrv\b'
  # Phase F: the published 90% confidence bounds of the ERS poverty rate.
  pov_ci_upper: '^CI90UBALLP\b'
  pov_ci_lower: '^CI90LBALLP\b'

queries:
  # ================================================================= phase_d
  - id: d-uninsured100-diabetes
    tier: phase_d
    query: "Find the 100 counties with the highest uninsured rates. Is diabetes more common in those counties than in all other counties?"
    note: "two steps: q1 ranks, q2 compares q1's counties against the rest"
    measures: {m1: uninsured_rate, m2: diabetes}
    gold: |
      WITH u AS (SELECT fips, value FROM {latest:m1} t WHERE value IS NOT NULL),
      top AS (SELECT fips FROM u ORDER BY value DESC LIMIT 100)
      SELECT d.fips, d.value,
             CASE WHEN d.fips IN (SELECT fips FROM top) THEN 'top100' ELSE 'rest' END AS grp
      FROM {latest:m2} d WHERE d.fips IN (SELECT fips FROM u)
    compare: {kind: groups, rel_tol: 0.05, min_jaccard: 0.85}
    wrong:
      - expect: INCOMPLETE           # the 100 counties alone, no comparison group
        sql: |
          WITH top AS (SELECT fips FROM {latest:m1} t ORDER BY value DESC NULLS LAST LIMIT 100)
          SELECT fips, value FROM {latest:m2} d WHERE fips IN (SELECT fips FROM top)

  - id: d-mo-poverty20-distance
    tier: phase_d
    query: "Find the 20 Missouri counties with the highest poverty rates. How far, in miles, is the center of each of those counties from the nearest hospital?"
    note: "q2 measures distance only for q1's counties"
    measures: {m1: poverty_rate, m2: hospitals}
    gold: |
      WITH top AS (SELECT fips FROM {latest:m1} t WHERE LEFT(fips, 2) = '29'
                   ORDER BY value DESC NULLS LAST LIMIT 20)
      SELECT g.fips,
             (SELECT min(ST_Distance(ST_Centroid(g.geom)::geography, h.geom::geography))
              FROM table_7fd78ade6d9847dab7aff72866124f79_hospitals h) / 1609.344 AS value
      FROM county_geom g WHERE g.fips IN (SELECT fips FROM top)
    compare: {kind: values, rel_tol: 0.03, abs_tol: 0.5}
    wrong:
      - expect: WRONG_GEOGRAPHY      # every Missouri county, not q1's 20
        sql: |
          SELECT g.fips,
                 (SELECT min(ST_Distance(ST_Centroid(g.geom)::geography, h.geom::geography))
                  FROM table_7fd78ade6d9847dab7aff72866124f79_hospitals h) / 1609.344 AS value
          FROM county_geom g WHERE g.state_fp = '29'

  - id: d-unemp-outliers-poverty
    tier: phase_d
    query: "Which counties are statistical outliers for the unemployment rate? Is the poverty rate in those outlier counties different from everywhere else?"
    note: "q1 is outlier (Tukey fence, 1.5 IQR, both tails); q2 compares poverty in q1's counties with the rest"
    measures: {m1: unemployment_rate, m2: poverty_rate}
    gold: |
      WITH u AS (SELECT fips, value FROM {latest:m1} t WHERE value IS NOT NULL),
      q AS (SELECT percentile_cont(0.25) WITHIN GROUP (ORDER BY value) AS q1,
                   percentile_cont(0.75) WITHIN GROUP (ORDER BY value) AS q3 FROM u),
      o AS (SELECT u.fips FROM u, q
            WHERE u.value > q.q3 + 1.5 * (q.q3 - q.q1) OR u.value < q.q1 - 1.5 * (q.q3 - q.q1))
      SELECT p.fips, p.value,
             CASE WHEN p.fips IN (SELECT fips FROM o) THEN 'outlier' ELSE 'rest' END AS grp
      FROM {latest:m2} p WHERE p.fips IN (SELECT fips FROM u)
    compare: {kind: groups, rel_tol: 0.06, min_jaccard: 0.8}

  - id: d-smallest50-diabetes10-distance
    tier: phase_d
    query: "Take the 50 least populous counties in the country. Of those, which 10 have the highest diabetes prevalence? How far is each of those 10 from the nearest hospital, in miles?"
    note: "THREE steps, each using the one before: the done-when shape for Phase D"
    measures: {m1: population, m2: diabetes, m3: hospitals}
    gold: |
      WITH small AS (SELECT fips FROM {latest:m1} t WHERE value IS NOT NULL
                     ORDER BY value ASC LIMIT 50),
      d AS (SELECT fips FROM {latest:m2} t
            WHERE fips IN (SELECT fips FROM small) AND value IS NOT NULL
            ORDER BY value DESC LIMIT 10)
      SELECT g.fips,
             (SELECT min(ST_Distance(ST_Centroid(g.geom)::geography, h.geom::geography))
              FROM table_7fd78ade6d9847dab7aff72866124f79_hospitals h) / 1609.344 AS value
      FROM county_geom g WHERE g.fips IN (SELECT fips FROM d)
    compare: {kind: values, rel_tol: 0.03, abs_tol: 0.5, min_coverage: 0.8}
    wrong:
      - expect: WRONG_GEOGRAPHY      # stopped after step 2's set was ignored: all 50
        sql: |
          WITH small AS (SELECT fips FROM {latest:m1} t WHERE value IS NOT NULL
                         ORDER BY value ASC LIMIT 50)
          SELECT g.fips,
                 (SELECT min(ST_Distance(ST_Centroid(g.geom)::geography, h.geom::geography))
                  FROM table_7fd78ade6d9847dab7aff72866124f79_hospitals h) / 1609.344 AS value
          FROM county_geom g WHERE g.fips IN (SELECT fips FROM small)

  - id: d-poor-quarter-smoking-copd
    tier: phase_d
    query: "Take the poorest quarter of counties by median household income. Within those counties, how strongly is adult smoking related to COPD?"
    note: >-
      q1 restricts, q2 correlates within q1's counties: Spearman rho. PLACES vs
      PLACES is inflated by shared model covariates (CLAUDE.md); this tests the
      mechanics, not a finding.
    measures: {m1: income, m2: smoking, m3: copd}
    gold: |
      WITH i AS (SELECT fips, value FROM {latest:m1} t WHERE value IS NOT NULL),
      cut AS (SELECT percentile_cont(0.25) WITHIN GROUP (ORDER BY value) AS c FROM i),
      poor AS (SELECT i.fips FROM i, cut WHERE i.value <= cut.c),
      j AS (SELECT s.fips, s.value AS sv, c.value AS cv
            FROM {latest:m2} s JOIN {latest:m3} c USING (fips)
            WHERE s.fips IN (SELECT fips FROM poor) AND s.value IS NOT NULL AND c.value IS NOT NULL),
      r AS (SELECT rank() OVER (ORDER BY sv) + (count(*) OVER (PARTITION BY sv) - 1) / 2.0 AS rs,
                   rank() OVER (ORDER BY cv) + (count(*) OVER (PARTITION BY cv) - 1) / 2.0 AS rc
            FROM j)
      SELECT NULL, corr(rs, rc) FROM r
    compare: {kind: scalar, abs_tol: 0.04}
    wrong:
      - expect: WRONG_VALUE          # the national correlation, restriction dropped
        sql: |
          WITH j AS (SELECT s.value AS sv, c.value AS cv
                     FROM {latest:m2} s JOIN {latest:m3} c USING (fips)
                     WHERE s.value IS NOT NULL AND c.value IS NOT NULL),
          r AS (SELECT rank() OVER (ORDER BY sv) AS rs, rank() OVER (ORDER BY cv) AS rc FROM j)
          SELECT NULL, corr(rs, rc) - 0.2 FROM r

  - id: d-co-firestations-income
    tier: phase_d
    query: "Find the 10 Colorado counties with the most fire stations per 10,000 residents. What is the median household income in each of them?"
    note: "q1 is count -> normalize -> rank in one state; q2 loads income for q1's counties. Scored as the county SET (income is checked by the measure binding)"
    measures: {m1: fire_stations, m2: population, m3: income}
    gold: |
      WITH c AS (SELECT g.fips, count(f.geom) AS n FROM county_geom g
                 LEFT JOIN d968f276355a41d1bd1451be6ee4dbac_fire_stations f
                   ON ST_Intersects(g.geom, f.geom)
                 WHERE g.state_fp = '08' GROUP BY g.fips),
      r AS (SELECT c.fips, c.n * 10000.0 / NULLIF(p.value, 0) AS v FROM c JOIN {latest:m2} p USING (fips)),
      top AS (SELECT fips FROM r ORDER BY v DESC NULLS LAST LIMIT 10)
      SELECT i.fips, i.value FROM {latest:m3} i WHERE i.fips IN (SELECT fips FROM top)
    compare: {kind: set, min_jaccard: 0.6}

  - id: d-asthma-then-rainfall
    tier: refuse
    query: "Find the 20 counties with the highest asthma rates. What is the average annual rainfall in those counties?"
    note: "q1 is answerable, q2 is not (no climate data): the workflow must stop with NO rows, not return q1's"
    compare: {kind: refuse}

  # ================================================================= phase_e
  - id: e-stl-tract-poverty
    tier: phase_e
    query: "Which census tracts in the city of St. Louis have the highest share of people below 150% of the poverty line?"
    note: "tract level; St. Louis city is its own county (29510), 104 tracts"
    measures: {m1: pov150}
    gold: |
      SELECT t.fips, t.value FROM {geo:tract:m1} t
      JOIN geo_unit_tract u ON u.geoid = t.fips WHERE u.county_fips = '29510'
    compare: {kind: top_k, k: 10, direction: desc, min_overlap: 0.8}
    wrong:
      - expect: WRONG_GEOGRAPHY      # every Missouri tract
        sql: |
          SELECT t.fips, t.value FROM {geo:tract:m1} t
          JOIN geo_unit_tract u ON u.geoid = t.fips WHERE u.state_fp = '29'
          ORDER BY t.value DESC LIMIT 10

  - id: e-cook-zip-diabetes
    tier: phase_e
    query: "Which ZIP codes in Cook County, Illinois have the highest diabetes prevalence?"
    note: "ZCTA level; a ZIP is 'in' Cook if most of it is (crosswalk share), or if any of it is"
    measures: {m1: diabetes_zip}
    gold:
      - |
        SELECT z.fips, z.value FROM {geo:zcta:m1} z WHERE z.fips IN (
          SELECT from_geoid FROM geo_crosswalk WHERE from_level = 'zcta' AND to_level = 'county'
            AND to_geoid = '17031' AND from_share >= 0.5)
      - |
        SELECT z.fips, z.value FROM {geo:zcta:m1} z WHERE z.fips IN (
          SELECT from_geoid FROM geo_crosswalk WHERE from_level = 'zcta' AND to_level = 'county'
            AND to_geoid = '17031')
    compare: {kind: top_k, k: 10, direction: desc, min_overlap: 0.7}

  - id: e-mi-noveh-rollup
    tier: phase_e
    query: "Using census tract data, what share of people in each Michigan county live in households without a vehicle, weighting each tract by its population?"
    note: >-
      tract -> county roll-up, population-weighted; the published county figure
      is an acceptable alternative. The weight is not a measure the plan must
      load: a roll-up's weight is chosen in code and is not in provenance, which
      first scored a correct roll-up WRONG_MEASURE (2026-11-11).
    measures: {m1: noveh}
    gold:
      - |
        SELECT u.county_fips, sum(v.value * p.value) / NULLIF(sum(p.value), 0) AS value
        FROM {geo:tract:m1} v
        JOIN (SELECT geoid AS fips, value FROM geo_values WHERE level = 'tract' AND code = 'SVI_E_TOTPOP') p USING (fips)
        JOIN geo_unit_tract u ON u.geoid = v.fips
        WHERE u.state_fp = '26' GROUP BY u.county_fips
      - |
        SELECT fips, value FROM acs_county_values
        WHERE census_code = 'SVI_EP_NOVEH' AND LEFT(fips, 2) = '26'
    compare: {kind: values, rel_tol: 0.08, abs_tol: 0.3}
    wrong:
      - expect: WRONG_VALUE          # unweighted mean of tract shares
        sql: |
          SELECT u.county_fips, avg(v.value) * 1.5 AS value FROM {geo:tract:m1} v
          JOIN geo_unit_tract u ON u.geoid = v.fips WHERE u.state_fp = '26' GROUP BY 1

  - id: e-co-grid-density
    tier: phase_e
    query: "Where are the most densely populated 4 km grid cells in Colorado?"
    note: "the WorldPop pyramid; density = people per square mile of the cell"
    measures: {m1: worldpop}
    gold: |
      SELECT v.fips, v.value / (ST_Area(u.geom::geography) / 2589988.110336) AS value
      FROM {geo:grid4k:m1} v JOIN geo_unit_grid4k u ON u.geoid = v.fips
      WHERE u.state_fp = '08'
    compare: {kind: top_k, k: 20, direction: desc, min_overlap: 0.7}

  - id: e-denver-tract-uninsured
    tier: phase_e
    query: "Show the uninsured rate for every census tract in Denver."
    note: "Denver city and county are one (08031)"
    measures: {m1: uninsured_tract}
    gold: |
      SELECT t.fips, t.value FROM {geo:tract:m1} t
      JOIN geo_unit_tract u ON u.geoid = t.fips WHERE u.county_fips = '08031'
    compare: {kind: values, rel_tol: 0.001, abs_tol: 0.05}
    wrong:
      - expect: WRONG_GEOGRAPHY      # the county figure, one row
        sql: |
          SELECT fips, value FROM acs_county_values
          WHERE census_code = 'SVI_EP_UNINSUR' AND fips = '08031'

  - id: e-mo-tract-poverty-spread
    tier: phase_e
    query: "In which Missouri counties does poverty vary the most from one census tract to another?"
    note: "a within-county statistic over tracts: standard deviation, or the range"
    measures: {m1: pov150}
    gold:
      - |
        SELECT u.county_fips, stddev_samp(t.value) AS value FROM {geo:tract:m1} t
        JOIN geo_unit_tract u ON u.geoid = t.fips
        WHERE u.state_fp = '29' GROUP BY 1 HAVING count(*) >= 3
      - |
        SELECT u.county_fips, max(t.value) - min(t.value) AS value FROM {geo:tract:m1} t
        JOIN geo_unit_tract u ON u.geoid = t.fips
        WHERE u.state_fp = '29' GROUP BY 1 HAVING count(*) >= 3
    compare: {kind: top_k, k: 10, direction: desc, min_overlap: 0.6}

  - id: e-zip-65721-counties
    tier: phase_e
    query: "Which counties does ZIP code 65721 fall in, and what percent of the ZIP is in each?"
    note: "a crosswalk lookup: Christian 98%, Greene 2%"
    gold: |
      SELECT to_geoid, from_share * 100 AS value FROM geo_crosswalk
      WHERE from_level = 'zcta' AND to_level = 'county' AND from_geoid = '65721'
    compare: {kind: values, abs_tol: 2.0}

  - id: e-co-worldpop-county
    tier: phase_e
    query: "Estimate the population of each Colorado county from the 1 km population grid."
    note: "zonal sum of the raster to counties; the loaded county roll-up is the answer"
    measures: {m1: worldpop}
    gold: |
      SELECT fips, value FROM {latest:m1} t WHERE LEFT(fips, 2) = '08'
    compare: {kind: values, rel_tol: 0.01}

  # ================================================================= phase_f
  - id: f-mo-pop-far-hospital
    tier: phase_f
    query: "How many people in Missouri live more than 20 miles from the nearest hospital?"
    note: "people, not counties: tract population by tract-centroid distance (exact nearest)"
    measures: {m1: hospitals, m2: unit_population}
    gold: |
      SELECT NULL, sum(p.value) FROM geo_unit_tract u
      JOIN {geo:tract:m2} p ON p.fips = u.geoid
      CROSS JOIN LATERAL (SELECT ST_Distance(u.pt::geography, h.geom::geography) AS d0
                          FROM table_7fd78ade6d9847dab7aff72866124f79_hospitals h
                          ORDER BY h.geom <-> u.pt LIMIT 1) k
      CROSS JOIN LATERAL (SELECT min(ST_Distance(u.pt::geography, h.geom::geography)) AS d
                          FROM table_7fd78ade6d9847dab7aff72866124f79_hospitals h
                          WHERE h.geom && ST_Expand(u.pt, k.d0 * 1.01 /
                            (110574 * cos(radians(least(abs(ST_Y(u.pt)) + k.d0 / 110574, 89.9)))))) x
      WHERE u.state_fp = '29' AND x.d / 1609.344 > 20
    compare: {kind: scalar, rel_tol: 0.1}
    wrong:
      - expect: WRONG_VALUE          # counted from county centroids and county totals
        sql: |
          SELECT NULL, sum(p.value) * 1.5 FROM geo_unit_tract u JOIN {geo:tract:m2} p ON p.fips = u.geoid
          WHERE u.state_fp = '29'

  - id: f-co-share-within-5mi
    tier: phase_f
    query: "What share of Colorado's population lives within 5 miles of a hospital?"
    note: "a catchment: tract population whose centroid is within 5 miles; percent or fraction"
    measures: {m1: hospitals, m2: unit_population}
    gold:
      - |
        SELECT NULL, 100.0 * sum(p.value) FILTER (WHERE EXISTS (
                 SELECT 1 FROM table_7fd78ade6d9847dab7aff72866124f79_hospitals h
                 WHERE h.geom && ST_Expand(u.pt, 0.1)
                   AND ST_DWithin(h.geom::geography, u.pt::geography, 8046.72)))
               / sum(p.value)
        FROM geo_unit_tract u JOIN {geo:tract:m2} p ON p.fips = u.geoid WHERE u.state_fp = '08'
      - |
        SELECT NULL, sum(p.value) FILTER (WHERE EXISTS (
                 SELECT 1 FROM table_7fd78ade6d9847dab7aff72866124f79_hospitals h
                 WHERE h.geom && ST_Expand(u.pt, 0.1)
                   AND ST_DWithin(h.geom::geography, u.pt::geography, 8046.72)))
               / sum(p.value)
        FROM geo_unit_tract u JOIN {geo:tract:m2} p ON p.fips = u.geoid WHERE u.state_fp = '08'
    compare: {kind: scalar, rel_tol: 0.05}

  - id: f-tx-hospital-access-2sfca
    tier: phase_f
    query: "Which Texas counties have the worst access to hospitals once you account for how many people each hospital has to serve, using a 30-mile catchment?"
    note: >-
      two-step floating catchment (2SFCA): each hospital's ratio is 1 / the
      population within 30 mi of it (county centroids, any state); a county's
      access is the sum of the ratios of hospitals within 30 mi, per 100,000.
      Lowest access first; ties at zero widen the gold set.
    measures: {m1: hospitals, m2: population}
    gold: |
      WITH c AS (SELECT g.fips, ST_Centroid(g.geom) AS pt, p.value AS pop
                 FROM county_geom g JOIN {latest:m2} p USING (fips) WHERE p.value > 0),
      h AS (SELECT row_number() OVER () AS id, geom
            FROM table_7fd78ade6d9847dab7aff72866124f79_hospitals
            WHERE geom && ST_MakeEnvelope(-108.5, 24.5, -92.5, 37.5, 4326)),
      r AS (SELECT h.id, h.geom, 1.0 / NULLIF(sum(c.pop), 0) AS ratio
            FROM h JOIN c ON c.pt && ST_Expand(h.geom, 0.75)
                         AND ST_DWithin(h.geom::geography, c.pt::geography, 48280.32)
            GROUP BY h.id, h.geom)
      SELECT c.fips, COALESCE(sum(r.ratio), 0) * 100000 AS value
      FROM c LEFT JOIN r ON r.geom && ST_Expand(c.pt, 0.75)
                        AND ST_DWithin(r.geom::geography, c.pt::geography, 48280.32)
      WHERE LEFT(c.fips, 2) = '48' GROUP BY c.fips
    # values, not a ranking: the worst tail is 24 counties tied at zero access,
    # so any "farthest from a hospital" list passed a top-k compare.
    compare: {kind: values, rel_tol: 0.15, abs_tol: 0.5, min_within: 0.8}
    wrong:
      - expect: WRONG_VALUE          # nearest distance instead of access
        sql: |
          SELECT g.fips, -(SELECT min(ST_Distance(ST_Centroid(g.geom)::geography, h.geom::geography))
                           FROM table_7fd78ade6d9847dab7aff72866124f79_hospitals h) AS value
          FROM county_geom g WHERE g.state_fp = '48'

  - id: f-unemp-neighbor-gap
    tier: phase_f
    query: "Which counties have a much higher unemployment rate than the average of their neighboring counties?"
    note: "spatial lag: value minus the mean of contiguous neighbours (or the ratio)"
    measures: {m1: unemployment_rate}
    gold:
      - |
        SELECT u.fips, u.value - avg(n.value) AS value
        FROM {latest:m1} u JOIN county_neighbors cn ON cn.fips = u.fips
        JOIN {latest:m1} n ON n.fips = cn.neighbor_fips
        GROUP BY u.fips, u.value
      - |
        SELECT u.fips, u.value / NULLIF(avg(n.value), 0) AS value
        FROM {latest:m1} u JOIN county_neighbors cn ON cn.fips = u.fips
        JOIN {latest:m1} n ON n.fips = cn.neighbor_fips
        GROUP BY u.fips, u.value
    # Fully determined by the measure: a correct lag reproduces the ranking.
    # The raw level overlaps it by 0.50 at k=20, so 0.6 could not tell them apart.
    compare: {kind: top_k, k: 20, direction: desc, min_overlap: 0.8}
    wrong:
      - expect: WRONG_VALUE          # the level itself, no neighbour comparison
        sql: |
          SELECT fips, value FROM {latest:m1} t

  - id: f-midwest-unemp-change
    tier: phase_f
    query: "Which Midwest counties saw the largest increase in the unemployment rate between 2019 and 2023?"
    note: "change between two named years, in points or percent"
    measures: {m1: unemployment_yearly}
    gold:
      - |
        SELECT a.fips, b.value - a.value AS value
        FROM {year:m1:2019} a JOIN {year:m1:2023} b USING (fips)
        WHERE LEFT(a.fips, 2) IN {region:midwest}
      - |
        SELECT a.fips, (b.value - a.value) / NULLIF(a.value, 0) * 100 AS value
        FROM {year:m1:2019} a JOIN {year:m1:2023} b USING (fips)
        WHERE LEFT(a.fips, 2) IN {region:midwest}
    compare: {kind: top_k, k: 15, direction: desc, min_overlap: 0.7}

  - id: f-mo-poverty-precision
    tier: phase_f
    query: "Which 10 Missouri counties have the least precise poverty rate estimates?"
    note: "uncertainty: the width of the published 90% confidence interval"
    measures: {m1: pov_ci_upper, m2: pov_ci_lower}
    gold: |
      SELECT a.fips, a.value - b.value AS value
      FROM {latest:m1} a JOIN {latest:m2} b USING (fips) WHERE LEFT(a.fips, 2) = '29'
    compare: {kind: top_k, k: 10, direction: desc, min_overlap: 0.7}
    wrong:
      - expect: WRONG_MEASURE        # the poverty rate itself, not its interval
        bind: {m1: PCTPOVALL}
        sql: |
          SELECT fips, value FROM {latest:m1} t WHERE LEFT(fips, 2) = '29'

  - id: f-diabetes-residual-income
    tier: phase_f
    query: "For each county, how much higher or lower is the diabetes rate than its median household income would predict?"
    note: >-
      regression residual per county, diabetes ~ income (linear, or on log
      income), in percentage points. First written as "which counties are much
      higher than expected" and scored top-k: the raw rate overlapped the
      residual ranking by 0.8+ (income explains little of the tail), so the
      ranking could not tell a residual from no adjustment at all.
    measures: {m1: diabetes, m2: income}
    gold:
      - |
        WITH j AS (SELECT d.fips, d.value AS y, i.value AS x
                   FROM {latest:m1} d JOIN {latest:m2} i USING (fips)
                   WHERE d.value IS NOT NULL AND i.value IS NOT NULL),
        f AS (SELECT regr_slope(y, x) AS b, regr_intercept(y, x) AS a FROM j)
        SELECT j.fips, j.y - (f.a + f.b * j.x) AS value FROM j, f
      - |
        WITH j AS (SELECT d.fips, d.value AS y, ln(i.value) AS x
                   FROM {latest:m1} d JOIN {latest:m2} i USING (fips)
                   WHERE d.value IS NOT NULL AND i.value > 0),
        f AS (SELECT regr_slope(y, x) AS b, regr_intercept(y, x) AS a FROM j)
        SELECT j.fips, j.y - (f.a + f.b * j.x) AS value FROM j, f
    compare: {kind: values, abs_tol: 0.3, min_within: 0.9}
    wrong:
      - expect: WRONG_VALUE          # the raw rate: income never accounted for
        sql: |
          SELECT fips, value FROM {latest:m1} t

  # ================================================================== refuse
  - id: x-denver-tract-rainfall
    tier: refuse
    query: "Which census tracts in Denver get the most rainfall?"
    note: "finer geography does not create climate data"
    compare: {kind: refuse}

  - id: x-hospital-closures-mortality
    tier: refuse
    query: "Did rural hospital closures since 2010 increase mortality in the counties that lost a hospital?"
    note: "no closure history is loaded, and a causal claim needs more than a correlation"
    compare: {kind: refuse}
