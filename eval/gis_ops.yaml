  # ===================================================== nearest_dev
  # H6 tier 1 item 3 (docs/GIS_OPS_PLAN.md): WHICH feature is nearest, and k.
  # Written 2026-11-20 before any planner run. Gold is brute force: every
  # unit point x every feature of the layer, nationally, ranked by geodesic
  # distance (no index, no box). A county is measured from ST_Centroid, a
  # tract from geo_unit.pt, as the op measures them. Names are the layer's
  # "name, city, state", k of them nearest first joined by "; ", ties broken by
  # name; `compare.names` checks them, so a distance with no name, or the
  # wrong feature at the right distance, is not CORRECT.
  - id: n-mo-hospital-name
    tier: nearest_dev
    query: "Which hospital is closest to the center of each Missouri county, and how many miles away is it?"
    measures: {m1: hifld_hospitals}
    gold: |
      WITH u AS (SELECT fips, ST_Centroid(geom) AS pt FROM county_geom WHERE state_fp = '29'),
      d AS (SELECT u.fips, ST_Distance(u.pt::geography, h.geom::geography) AS d,
                   concat_ws(', ', NULLIF(h.name::text,''), NULLIF(h.city::text,''), NULLIF(h.state::text,'')) AS lbl
            FROM u CROSS JOIN {table:m1} h),
      r AS (SELECT *, row_number() OVER (PARTITION BY fips ORDER BY d, lbl) AS rn FROM d)
      SELECT fips, d / 1609.344, lbl FROM r WHERE rn = 1
    compare: {kind: values, rel_tol: 0.03, abs_tol: 0.5, names: true}
    wrong:
      - expect: WRONG_VALUE          # the distance, but no name
        sql: |
          SELECT g.fips, (SELECT min(ST_Distance(ST_Centroid(g.geom)::geography, h.geom::geography))
                          FROM {table:m1} h) / 1609.344
          FROM county_geom g WHERE g.state_fp = '29'
      - expect: WRONG_VALUE          # kilometres
        sql: |
          WITH u AS (SELECT fips, ST_Centroid(geom) AS pt FROM county_geom WHERE state_fp = '29'),
          d AS (SELECT u.fips, ST_Distance(u.pt::geography, h.geom::geography) AS d,
                       concat_ws(', ', NULLIF(h.name::text,''), NULLIF(h.city::text,''), NULLIF(h.state::text,'')) AS lbl
                FROM u CROSS JOIN {table:m1} h),
          r AS (SELECT *, row_number() OVER (PARTITION BY fips ORDER BY d, lbl) AS rn FROM d)
          SELECT fips, d / 1000, lbl FROM r WHERE rn = 1
      - expect: WRONG_VALUE          # the second-nearest named, at the nearest's distance
        sql: |
          WITH u AS (SELECT fips, ST_Centroid(geom) AS pt FROM county_geom WHERE state_fp = '29'),
          d AS (SELECT u.fips, ST_Distance(u.pt::geography, h.geom::geography) AS d,
                       concat_ws(', ', NULLIF(h.name::text,''), NULLIF(h.city::text,''), NULLIF(h.state::text,'')) AS lbl
                FROM u CROSS JOIN {table:m1} h),
          r AS (SELECT *, row_number() OVER (PARTITION BY fips ORDER BY d, lbl) AS rn FROM d)
          SELECT a.fips, a.d / 1609.344, b.lbl FROM r a JOIN r b ON b.fips = a.fips AND b.rn = 2 WHERE a.rn = 1

