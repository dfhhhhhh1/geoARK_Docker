  # ===================================================== enrichment_dev
  # H6 tier 1 (docs/GIS_OPS_PLAN.md): features located in units that meet a
  # condition, each unit found by point-in-polygon (ST_Covers), brute force.
  # A feature on a shared boundary may sit in two units; at these counts that
  # moves nothing past the tolerances.
  - id: e-oh-hospitals-county-poverty
    tier: enrichment_dev
    query: "Which hospitals in Ohio are in counties where the poverty rate is above 15 percent?"
    note: "the hospitals themselves, in the Ohio counties whose poverty rate passes"
    measures: {m1: hifld_hospitals, m2: poverty_rate}
    gold: |
      SELECT {fkey:h.geom}, 1 FROM {table:m1} h
      JOIN county_geom c ON ST_Covers(c.geom, h.geom)
      JOIN {latest:m2} v ON v.fips = c.fips
      WHERE c.state_fp = '39' AND v.value > 15
    compare: {kind: set, features: true, min_jaccard: 0.95}
    wrong:
      - expect: WRONG_VALUE          # every Ohio hospital: the condition never applied
        sql: |
          SELECT {fkey:h.geom}, 1 FROM {table:m1} h JOIN county_geom c ON ST_Covers(c.geom, h.geom)
          WHERE c.state_fp = '39'
      - expect: WRONG_VALUE          # the other side of the threshold
        sql: |
          SELECT {fkey:h.geom}, 1 FROM {table:m1} h
          JOIN county_geom c ON ST_Covers(c.geom, h.geom) JOIN {latest:m2} v ON v.fips = c.fips
          WHERE c.state_fp = '39' AND v.value <= 15

  - id: e-mo-hospitals-tract-pov150
    tier: enrichment_dev
    query: "Which hospitals in Missouri are in census tracts where more than 40 percent of people live below 150 percent of the poverty line?"
    note: "tract values (SVI); a county poverty rate is the wrong unit"
    measures: {m1: hifld_hospitals, m2: pov150}
    gold: |
      SELECT {fkey:h.geom}, 1 FROM {table:m1} h
      JOIN geo_unit u ON u.level = 'tract' AND ST_Covers(u.geom, h.geom)
      JOIN {geo:tract:m2} v ON v.fips = u.geoid
      WHERE u.state_fp = '29' AND v.value > 40
    compare: {kind: set, features: true, min_jaccard: 0.95}
    wrong:
      - expect: WRONG_VALUE          # every Missouri hospital
        sql: |
          SELECT {fkey:h.geom}, 1 FROM {table:m1} h JOIN county_geom c ON ST_Covers(c.geom, h.geom)
          WHERE c.state_fp = '29'
