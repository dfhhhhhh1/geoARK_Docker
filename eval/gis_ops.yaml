  # ===================================================== value_filters_dev
  # H6 tier 1 item 2 (docs/GIS_OPS_PLAN.md): a layer narrowed by one of its
  # own numeric or date columns. Gold compares the source column directly.
  # HSIP writes "not available" as -999; a gold for "fewer than" leaves those
  # out (unknown is not small), and the wrong answer that counts them is
  # listed, because that is the failure this family exists to catch.
  - id: vf-mo-hospitals-beds-gt100
    tier: value_filters_dev
    query: "Which hospitals in Missouri have more than 100 beds?"
    measures: {m1: hifld_hospitals}
    gold: |
      SELECT {fkey:h.geom}, 1 FROM {table:m1} h
      WHERE h.beds > 100
        AND EXISTS (SELECT 1 FROM county_geom c WHERE c.state_fp = '29' AND ST_Intersects(c.geom, h.geom))
    compare: {kind: set, features: true, min_jaccard: 0.95}
    wrong:
      - expect: WRONG_VALUE          # every Missouri hospital: the filter never applied
        sql: |
          SELECT {fkey:h.geom}, 1 FROM {table:m1} h
          WHERE EXISTS (SELECT 1 FROM county_geom c WHERE c.state_fp = '29' AND ST_Intersects(c.geom, h.geom))

  # Arizona, not the first draft's Texas nursing homes: there the -999 rows
