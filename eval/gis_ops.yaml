  # ======================================================== composite_dev
  # H6 tier 1, item 4: one score from several measures. Gold recomputes every
  # percentile rank independently of the op: (count of units with a strictly
  # smaller value) / (n - 1), over the units of the STATE that have every
  # input (the study area; planner/composite.js scores within the area the
  # question names). A "low" input counts strictly LARGER values instead.
  # Distances are brute force over the whole hospital layer from the county
  # centroid, as nearest_distance measures.
  - id: c-mo-vuln-equal
    tier: composite_dev
    query: "Rank Missouri counties by a vulnerability index built from the poverty rate, the unemployment rate and the share of adults without health insurance. Which ten score highest?"
    note: "equal weights, percentile ranks within Missouri, all three higher = more vulnerable"
    measures: {m1: poverty_rate, m2: unemployment_rate, m3: uninsured_adults}
    gold: |
      WITH b AS (
        SELECT p.fips, p.value AS v1, u.value AS v2, i.value AS v3
        FROM {latest:m1} p JOIN {latest:m2} u USING (fips) JOIN {latest:m3} i USING (fips)
        WHERE left(p.fips, 2) = '29' AND p.value IS NOT NULL AND u.value IS NOT NULL AND i.value IS NOT NULL),
      n AS (SELECT (count(*) - 1)::float8 AS d FROM b)
      SELECT b.fips,
        ((SELECT count(*) FROM b x WHERE x.v1 < b.v1) / n.d
       + (SELECT count(*) FROM b x WHERE x.v2 < b.v2) / n.d
       + (SELECT count(*) FROM b x WHERE x.v3 < b.v3) / n.d) / 3
      FROM b, n
    compare: {kind: top_k, k: 10, direction: desc, min_overlap: 0.8, value_rel_tol: 0.03}
    wrong:
      - expect: WRONG_VALUE          # national percentile ranks, then Missouri shown
        sql: |
          WITH b AS (
            SELECT p.fips, p.value AS v1, u.value AS v2, i.value AS v3
            FROM {latest:m1} p JOIN {latest:m2} u USING (fips) JOIN {latest:m3} i USING (fips)
            WHERE p.value IS NOT NULL AND u.value IS NOT NULL AND i.value IS NOT NULL),
          n AS (SELECT (count(*) - 1)::float8 AS d FROM b)
          SELECT b.fips,
            ((SELECT count(*) FROM b x WHERE x.v1 < b.v1) / n.d
           + (SELECT count(*) FROM b x WHERE x.v2 < b.v2) / n.d
           + (SELECT count(*) FROM b x WHERE x.v3 < b.v3) / n.d) / 3
          FROM b, n WHERE left(b.fips, 2) = '29'
      - expect: WRONG_VALUE          # ranked by poverty alone
        sql: |
          SELECT fips, value FROM {latest:m1} WHERE left(fips, 2) = '29'

  - id: c-tx-stated-weights
    tier: composite_dev
    query: "Score every Texas county on poverty rate, median household income and distance to the nearest hospital, weighting poverty at 50%, income at 25% and hospital distance at 25%. Lower income should score higher."
    note: "stated weights; income inverted; farther from a hospital scores higher"
    measures: {m1: poverty_rate, m2: med_income, m3: hospitals}
    gold: |
      WITH d AS (
        SELECT g.fips, (SELECT min(ST_Distance(ST_Centroid(g.geom)::geography, h.geom::geography))
                        FROM {table:m3} h) / 1609.344 AS v3
        FROM county_geom g WHERE g.state_fp = '48'),
      b AS (
        SELECT p.fips, p.value AS v1, m.value AS v2, d.v3
        FROM {latest:m1} p JOIN {latest:m2} m USING (fips) JOIN d USING (fips)
        WHERE p.value IS NOT NULL AND m.value IS NOT NULL AND d.v3 IS NOT NULL),
      n AS (SELECT (count(*) - 1)::float8 AS d FROM b)
      SELECT b.fips,
        0.50 * (SELECT count(*) FROM b x WHERE x.v1 < b.v1) / n.d
      + 0.25 * (SELECT count(*) FROM b x WHERE x.v2 > b.v2) / n.d
      + 0.25 * (SELECT count(*) FROM b x WHERE x.v3 < b.v3) / n.d
      FROM b, n
    compare: {kind: values, rel_tol: 0, abs_tol: 0.02, min_within: 0.95}
    wrong:
      - expect: WRONG_VALUE          # equal weights: the stated ones ignored
        sql: |
          WITH d AS (
            SELECT g.fips, (SELECT min(ST_Distance(ST_Centroid(g.geom)::geography, h.geom::geography))
                            FROM {table:m3} h) / 1609.344 AS v3
            FROM county_geom g WHERE g.state_fp = '48'),
          b AS (SELECT p.fips, p.value AS v1, m.value AS v2, d.v3
                FROM {latest:m1} p JOIN {latest:m2} m USING (fips) JOIN d USING (fips)
                WHERE p.value IS NOT NULL AND m.value IS NOT NULL AND d.v3 IS NOT NULL),
          n AS (SELECT (count(*) - 1)::float8 AS d FROM b)
          SELECT b.fips, ((SELECT count(*) FROM b x WHERE x.v1 < b.v1) / n.d
                        + (SELECT count(*) FROM b x WHERE x.v2 > b.v2) / n.d
                        + (SELECT count(*) FROM b x WHERE x.v3 < b.v3) / n.d) / 3
          FROM b, n
      - expect: WRONG_VALUE          # income not inverted: richer scores higher
        sql: |
          WITH d AS (
            SELECT g.fips, (SELECT min(ST_Distance(ST_Centroid(g.geom)::geography, h.geom::geography))
                            FROM {table:m3} h) / 1609.344 AS v3
            FROM county_geom g WHERE g.state_fp = '48'),
          b AS (SELECT p.fips, p.value AS v1, m.value AS v2, d.v3
                FROM {latest:m1} p JOIN {latest:m2} m USING (fips) JOIN d USING (fips)
                WHERE p.value IS NOT NULL AND m.value IS NOT NULL AND d.v3 IS NOT NULL),
          n AS (SELECT (count(*) - 1)::float8 AS d FROM b)
          SELECT b.fips, 0.50 * (SELECT count(*) FROM b x WHERE x.v1 < b.v1) / n.d
                       + 0.25 * (SELECT count(*) FROM b x WHERE x.v2 < b.v2) / n.d
                       + 0.25 * (SELECT count(*) FROM b x WHERE x.v3 < b.v3) / n.d
          FROM b, n

  - id: c-ga-bottleneck
    tier: composite_dev
    query: "Which Georgia counties score high on all three of obesity, diabetes and physical inactivity? Give each county the lowest of its three percentile ranks, so one good measure cannot make up for a bad one."
    note: "non-compensatory: the minimum of three percentile ranks"
    measures: {m1: obesity, m2: diabetes, m3: inactivity}
    gold: |
      WITH b AS (
        SELECT o.fips, o.value AS v1, d.value AS v2, l.value AS v3
        FROM {latest:m1} o JOIN {latest:m2} d USING (fips) JOIN {latest:m3} l USING (fips)
        WHERE left(o.fips, 2) = '13' AND o.value IS NOT NULL AND d.value IS NOT NULL AND l.value IS NOT NULL),
      n AS (SELECT (count(*) - 1)::float8 AS d FROM b)
      SELECT b.fips, LEAST((SELECT count(*) FROM b x WHERE x.v1 < b.v1) / n.d,
                           (SELECT count(*) FROM b x WHERE x.v2 < b.v2) / n.d,
                           (SELECT count(*) FROM b x WHERE x.v3 < b.v3) / n.d)
      FROM b, n
    compare: {kind: values, rel_tol: 0, abs_tol: 0.02, min_within: 0.95}
    wrong:
      - expect: WRONG_VALUE          # compensatory: the mean of the three
        sql: |
          WITH b AS (
            SELECT o.fips, o.value AS v1, d.value AS v2, l.value AS v3
            FROM {latest:m1} o JOIN {latest:m2} d USING (fips) JOIN {latest:m3} l USING (fips)
            WHERE left(o.fips, 2) = '13' AND o.value IS NOT NULL AND d.value IS NOT NULL AND l.value IS NOT NULL),
          n AS (SELECT (count(*) - 1)::float8 AS d FROM b)
          SELECT b.fips, ((SELECT count(*) FROM b x WHERE x.v1 < b.v1) / n.d
                        + (SELECT count(*) FROM b x WHERE x.v2 < b.v2) / n.d
                        + (SELECT count(*) FROM b x WHERE x.v3 < b.v3) / n.d) / 3
          FROM b, n

  - id: c-ky-emphasis
    tier: composite_dev
    query: "Which Kentucky counties are most in need? Focus primarily on child poverty, while also considering the unemployment rate and median household income, where lower income means more need."
    note: "emphasis read as 2:1:1 (child poverty 50%, the other two 25% each); income inverted"
    measures: {m1: child_poverty, m2: unemployment_rate, m3: med_income}
    gold: |
      WITH b AS (
        SELECT c.fips, c.value AS v1, u.value AS v2, m.value AS v3
        FROM {latest:m1} c JOIN {latest:m2} u USING (fips) JOIN {latest:m3} m USING (fips)
        WHERE left(c.fips, 2) = '21' AND c.value IS NOT NULL AND u.value IS NOT NULL AND m.value IS NOT NULL),
      n AS (SELECT (count(*) - 1)::float8 AS d FROM b)
      SELECT b.fips,
        0.50 * (SELECT count(*) FROM b x WHERE x.v1 < b.v1) / n.d
      + 0.25 * (SELECT count(*) FROM b x WHERE x.v2 < b.v2) / n.d
      + 0.25 * (SELECT count(*) FROM b x WHERE x.v3 > b.v3) / n.d
      FROM b, n
    # Was `values` over all 120 counties: "which counties are most in need" is
    # answered with a top list, and dev r2 planned composite -> rank(10) and
    # scored INCOMPLETE on coverage. top_k with values keeps the emphasis
    # check only with a tight value tolerance: at 3% equal weights scored
    # CORRECT on the top 10 (self-test); at 0.5% they do not, and the op equals
    # this gold to 1e-16 (eval/gis_ops/composite/README.md). Changed 2026-11-21.
    compare: {kind: top_k, k: 10, direction: desc, min_overlap: 0.8, value_rel_tol: 0.005}
    wrong:
      - expect: WRONG_VALUE          # equal weights: the emphasis ignored
        sql: |
          WITH b AS (
            SELECT c.fips, c.value AS v1, u.value AS v2, m.value AS v3
            FROM {latest:m1} c JOIN {latest:m2} u USING (fips) JOIN {latest:m3} m USING (fips)
            WHERE left(c.fips, 2) = '21' AND c.value IS NOT NULL AND u.value IS NOT NULL AND m.value IS NOT NULL),
          n AS (SELECT (count(*) - 1)::float8 AS d FROM b)
          SELECT b.fips, ((SELECT count(*) FROM b x WHERE x.v1 < b.v1) / n.d
                        + (SELECT count(*) FROM b x WHERE x.v2 < b.v2) / n.d
                        + (SELECT count(*) FROM b x WHERE x.v3 > b.v3) / n.d) / 3
          FROM b, n

  # ===================================================== composite_heldout
  - id: c-co-ratio
    tier: composite_heldout
    query: "Build a composite score for Colorado counties from the unemployment rate and median household income, counting unemployment twice as heavily as income; low income should raise the score."
    measures: {m1: unemployment_rate, m2: med_income}
    gold: |
      WITH b AS (
        SELECT u.fips, u.value AS v1, m.value AS v2
        FROM {latest:m1} u JOIN {latest:m2} m USING (fips)
        WHERE left(u.fips, 2) = '08' AND u.value IS NOT NULL AND m.value IS NOT NULL),
      n AS (SELECT (count(*) - 1)::float8 AS d FROM b)
      SELECT b.fips, (2.0 * (SELECT count(*) FROM b x WHERE x.v1 < b.v1) / n.d
                    + 1.0 * (SELECT count(*) FROM b x WHERE x.v2 > b.v2) / n.d) / 3
      FROM b, n
    compare: {kind: values, rel_tol: 0, abs_tol: 0.02, min_within: 0.95}
    wrong:
      - expect: WRONG_VALUE          # equal weights
        sql: |
          WITH b AS (
            SELECT u.fips, u.value AS v1, m.value AS v2
            FROM {latest:m1} u JOIN {latest:m2} m USING (fips)
            WHERE left(u.fips, 2) = '08' AND u.value IS NOT NULL AND m.value IS NOT NULL),
          n AS (SELECT (count(*) - 1)::float8 AS d FROM b)
          SELECT b.fips, ((SELECT count(*) FROM b x WHERE x.v1 < b.v1) / n.d
                        + (SELECT count(*) FROM b x WHERE x.v2 > b.v2) / n.d) / 2
          FROM b, n

  - id: c-tn-geometric
    tier: composite_heldout
    query: "For Tennessee counties, combine the poverty rate, diabetes prevalence and the unemployment rate as a geometric mean of percentile ranks, so a county at the bottom on any one of them scores zero. Map the score for every county."
    # Was "List the top 10" with a top_k compare: --self-test showed the
    # arithmetic mean scores CORRECT on that top 10 (counties high on all three
    # read alike either way), so the gold could not tell the two methods apart.
    # Changed before any API run.
    measures: {m1: poverty_rate, m2: diabetes, m3: unemployment_rate}
    gold: |
      WITH b AS (
        SELECT p.fips, p.value AS v1, d.value AS v2, u.value AS v3
        FROM {latest:m1} p JOIN {latest:m2} d USING (fips) JOIN {latest:m3} u USING (fips)
        WHERE left(p.fips, 2) = '47' AND p.value IS NOT NULL AND d.value IS NOT NULL AND u.value IS NOT NULL),
      n AS (SELECT (count(*) - 1)::float8 AS d FROM b),
      r AS (SELECT b.fips, (SELECT count(*) FROM b x WHERE x.v1 < b.v1) / n.d AS r1,
                           (SELECT count(*) FROM b x WHERE x.v2 < b.v2) / n.d AS r2,
                           (SELECT count(*) FROM b x WHERE x.v3 < b.v3) / n.d AS r3 FROM b, n)
      SELECT fips, power(r1 * r2 * r3, 1.0 / 3) FROM r
    compare: {kind: values, rel_tol: 0, abs_tol: 0.02, min_within: 0.95}
    wrong:
      - expect: WRONG_VALUE          # the arithmetic mean
        sql: |
          WITH b AS (
            SELECT p.fips, p.value AS v1, d.value AS v2, u.value AS v3
            FROM {latest:m1} p JOIN {latest:m2} d USING (fips) JOIN {latest:m3} u USING (fips)
            WHERE left(p.fips, 2) = '47' AND p.value IS NOT NULL AND d.value IS NOT NULL AND u.value IS NOT NULL),
          n AS (SELECT (count(*) - 1)::float8 AS d FROM b)
          SELECT b.fips, ((SELECT count(*) FROM b x WHERE x.v1 < b.v1) / n.d
                        + (SELECT count(*) FROM b x WHERE x.v2 < b.v2) / n.d
                        + (SELECT count(*) FROM b x WHERE x.v3 < b.v3) / n.d) / 3
          FROM b, n
