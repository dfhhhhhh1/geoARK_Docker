server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths fall through to the React router
    location / {
        try_files $uri /index.html;
    }

    # Node API
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A local LLM can take a while on a cold prompt; don't cut it off.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Needed for the SSE progress stream (docs/AI-PIPELINE.md §5).
        proxy_buffering off;
        proxy_cache off;
    }

    # AutoGluon service (optional; `make automl` starts it).
    #
    # This upstream is addressed through a VARIABLE on purpose. With a literal
    # hostname, nginx resolves it once at startup and refuses to boot if the
    # name is missing -- which it is whenever the optional automl profile is
    # not running. Going through a variable defers resolution to request time,
    # so the site stays up and this route just 502s while automl is down.
    resolver 127.0.0.11 ipv6=off valid=30s;   # Docker's embedded DNS
    location ~ ^/automl/(.*)$ {
        set $automl_upstream http://automl:8000;
        proxy_pass $automl_upstream/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 100M;        # CSV uploads
        proxy_read_timeout 600s;          # training runs ~60s+
        proxy_send_timeout 600s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
