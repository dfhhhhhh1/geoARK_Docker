  # Metro regions: every CBSA of 1M+ people (POP_ESTIMATE summed over the
  # counties whose interior point is in it), its extent plus about 10 km.
  # Why: a query runs Dijkstra over ALL of its region's edges, and the cost is
  # the region's size, not the trip's: Texas (10.5M edges) took 27.5-29.8 s
  # for one drive time, at the 30 s execute limit; Missouri (4.3M) 11-12.5 s;
  # St. Louis (674k) 2.4 s (2026-11-23). A metro box is inside its state's box
  # and smaller, so the smallest-box tie-break (planner/ops/_network.js) sends
  # metro questions here. Metros that cross a state line (KC, Cincinnati,
  # Memphis, NYC) also keep both sides. No eval gold covers these.
