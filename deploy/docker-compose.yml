# GeoARK, reference deployment
#
# Additive: this does not touch GeoARK/docker-compose.yml. Run from ./deploy:
#     cp .env.example .env
#     docker compose up -d --build
#     docker compose --profile setup run --rm model-init     # once, to warm volumes
#
# Design notes live in ../docs/DEPLOYMENT.md.

name: geoark

services:

  # ---------------------------------------------------------------- web (SPA)
  web:
    build:
      context: ../frontend
      dockerfile: ../deploy/web.Dockerfile
      args:
        # From deploy/.env. Public once built (it rides in every tile URL);
        # passed this way only to keep it out of the repository.
        VITE_CARTO_KEY: ${VITE_CARTO_KEY:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------- api (Node)
  # No Python in this image. It talks to `embedder` and `ollama` over HTTP.
  api:
    build:
      context: ../backend
      dockerfile: ../deploy/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      EMBEDDER_URL: http://embedder:8000
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-gemma3:4b}
      # Hosted-planner A/B. LLM_PROVIDER stays "ollama" unless deliberately
      # changed: setting it to "google" sends every question and its retrieved
      # attribute list off the machine, which is the one thing the local-only
      # design exists to prevent. The key alone changes nothing -- it only makes
      # the `provider: "google"` request field usable by eval/provider_bench.py.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-3.8-flash}
      # Planning is harder than decomposition. Where RAM allows, point this at
      # a larger model (qwen3:14b) and leave LLM_MODEL small; it falls back to
      # LLM_MODEL when unset. See docs/AI-PIPELINE.md.
      PLAN_MODEL: ${PLAN_MODEL:-}
      PLAN_MAX_REPAIRS: ${PLAN_MAX_REPAIRS:-2}
      # Context window per model: planner / small model. See numCtx in
      # unified_search_server.js for why they differ.
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
      LLM_SMALL_NUM_CTX: ${LLM_SMALL_NUM_CTX:-4096}
      # --- access control -------------------------------------------------
      # Unset means NO AUTH: every endpoint open, including the LLM. That is
      # correct for localhost and wrong for anything reachable; the server logs
      # a warning at startup when it is unset.
      ACCESS_CODE: ${ACCESS_CODE:-}
      # Sessions are signed with this. Unset means a random key per start, so
      # everyone is signed out on restart -- fine, but set it in production.
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # Analysis is ~19s of a GPU that does one at a time, so its bucket is
      # deliberately far smaller than retrieval's.
      RATE_ANALYZE_BURST: ${RATE_ANALYZE_BURST:-5}
      RATE_ANALYZE_PER_MIN: ${RATE_ANALYZE_PER_MIN:-6}
      RATE_SEARCH_BURST: ${RATE_SEARCH_BURST:-30}
      RATE_SEARCH_PER_MIN: ${RATE_SEARCH_PER_MIN:-60}
      # Concurrency 1 matches the hardware: two resident models already occupy
      # 15.8 of 16.4 GB, so there is no room to generate twice at once.
      ANALYZE_CONCURRENCY: ${ANALYZE_CONCURRENCY:-1}
      ANALYZE_QUEUE_DEPTH: ${ANALYZE_QUEUE_DEPTH:-20}
      # Retrieval tunables. Defaults are the values the eval suite was tuned on
      # (see eval/README.md); override in .env to run an ablation.
      RRF_K: ${RRF_K:-60}
      BM25_K1: ${BM25_K1:-1.2}
      BM25_B: ${BM25_B:-0.75}
      MOE_PENALTY: ${MOE_PENALTY:-0.5}
      # Literature expansion (backend/expansion.js). On by default since
      # 2026-09-29; a no-op until `make semmed` has built the index. Requests
      # can pass {"expand": false} to A/B it without recreating this container.
      # See docs/EXPANSION.md.
      EXPAND_ENABLED: ${EXPAND_ENABLED:-1}
      EXPAND_MIN_SIM: ${EXPAND_MIN_SIM:-0.61}
      EXPAND_MAX_TERMS: ${EXPAND_MAX_TERMS:-4}
      EXPAND_QUOTA: ${EXPAND_QUOTA:-4}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-mygisdb}
      PGUSER: ${POSTGRES_USER:-geoark}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Both api and embedder must read the SAME catalog file. The image bakes a
      # copy in at build time; mounting the live file over it means editing the
      # CSV takes effect on restart, without a rebuild, and without the two
      # services drifting apart (which the API's row-count assert would reject).
      - ../backend/geoark_attributes.csv:/app/geoark_attributes.csv:ro
    depends_on:
      # NOT service_healthy for the embedder: on a cold volume it spends
      # minutes downloading the model, and waitForEmbedder() in the API polls
      # for it anyway (up to 15 min). Gating here would just time compose out.
      embedder:
        condition: service_started
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  # ------------------------------------------------- embedder (long-lived!)
  # The whole point: the SentenceTransformer is constructed ONCE at process
  # start, not once per query as the current spawn('python3', ...) does.
  embedder:
    build:
      context: ./embedder
      dockerfile: Dockerfile
    environment:
      HF_HOME: /models/hf                       # persisted weights (volume below)
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}      # flip to 1 once the cache is warm
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-base-en-v1.5}
      EMBED_INCLUDE_TAGS: ${EMBED_INCLUDE_TAGS:-1}
      EMBED_CACHE_DIR: /data/embeddings         # persisted corpus matrices
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
    volumes:
      - hf_cache:/models/hf                     # ~440 MB, downloaded once, ever
      - emb_cache:/data/embeddings              # 4555 x 768 matrix, computed once
      - ../backend/geoark_attributes.csv:/data/geoark_attributes.csv:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s                        # generous: first run downloads the model
    restart: unless-stopped

  # ------------------------------------------------------------- ollama (LLM)
  ollama:
    image: ollama/ollama:latest
    environment:
      # Trade-off, and it bites on small hosts. KEEP_ALIVE=-1 pins the model in
      # RAM so there is no per-request cold start -- but gemma3:4b then holds
      # ~5.5 GB indefinitely. On a machine with 8 GB given to Docker that is
      # most of the budget, and a sustained run can OOM the model runner.
      #
      # On <16 GB: set OLLAMA_KEEP_ALIVE=30m in .env so idle memory is
      # reclaimed, at the cost of a ~10s reload on the next cold request.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      # 1, not 2. Two resident models is for the Phase 3 small-router +
      # large-planner split, which does not exist yet; until then it just
      # invites the second model to be loaded and never freed.
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ollama_models:/root/.ollama             # multi-GB weights, survive rebuilds
    # Uncomment on a GPU host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    restart: unless-stopped

  # ------------------------------------------------------ db (PostGIS+vector)
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mygisdb}
      POSTGRES_USER: ${POSTGRES_USER:-geoark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geoark} -d ${POSTGRES_DB:-mygisdb}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ------------------------------------------------- automl (optional profile)
  # AutoGluon is a multi-GB image, so it is off by default. Start it with
  # `make automl`. The frontend's Report page degrades to a 502 without it.
  automl:
    build:
      context: ../backend
      dockerfile: ../deploy/automl.Dockerfile
    profiles: ["automl"]
    environment:
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
    volumes:
      - automl_models:/app/AutogluonModels
    restart: unless-stopped

  # -------------------------------------------------------- etl (job, not a service)
  # Loads county geometry, ACS values, and -- critically -- attribute_source,
  # the catalog -> physical column mapping that makes generated plans
  # executable at all. Run it with `make load-reference`.
  etl:
    build:
      context: ../etl
      dockerfile: ../deploy/etl.Dockerfile
    profiles: ["etl"]
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-mygisdb}
      PGUSER: ${POSTGRES_USER:-geoark}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Source geodata lives outside the repo (3.5 GB, gitignored). Point
      # GEODATA_DIR at it; read-only, because ETL never writes to the source.
      - ${GEODATA_DIR:-../../geospatial_database_data}:/data:ro
      - ../frontend/public:/app/frontend/public:ro
      - ../backend/geoark_attributes.csv:/app/backend/geoark_attributes.csv:ro
      # Mount the scripts over the baked-in copy. Without this every edit needs
      # an image rebuild, and it is easy to run a stale script without noticing.
      - ../etl:/app/etl:ro
      # SemMedDB predications (3.3 GB) and, optionally, scispaCy's UMLS KB, for
      # `make semmed`. Read once to build the index; never read at query time.
      - ${SEMMED_DIR:-../searchImprovement/search/search}:/semmed:ro
    depends_on:
      db:
        condition: service_healthy

  # ------------------------------------------ geospatial ETL (job, not a service)
  # Loads the HSIP shapefiles and geodatabases into PostGIS. This is the gate
  # for the other ~47% of the catalog: those attributes cannot resolve to a
  # physical table until their source data exists. Run with `make load-geo`.
  etl-geo:
    build:
      context: ../etl
      dockerfile: ../deploy/etl-gdal.Dockerfile
    profiles: ["etl"]
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-mygisdb}
      PGUSER: ${POSTGRES_USER:-geoark}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GEODATA_ROOT: /data
      # ingest.py tags new columns with the same model the existing catalog was
      # tagged with. A different tagger produces a catalog that is internally
      # inconsistent in a way retrieval cannot report.
      OLLAMA_URL: http://ollama:11434
      TAG_MODEL: ${TAG_MODEL:-gemma3:4b}
      CATALOG_CSV: /app/backend/geoark_attributes.csv
      FEATURE_MAP_CSV: /app/etl/facility_table_map.csv
    volumes:
      - ${GEODATA_DIR:-../../geospatial_database_data}:/data:ro
      # Somewhere to drop a file for ingest, separate from the read-only HSIP
      # source so an admin upload can never overwrite it.
      - ${INGEST_DIR:-./incoming}:/incoming:ro
      # NOT read-only: ingest.py appends catalog rows here. It takes a
      # timestamped backup before every write.
      - ../backend/geoark_attributes.csv:/app/backend/geoark_attributes.csv
      - ../etl:/app/etl                # ingest appends to facility_table_map.csv
    depends_on:
      db:
        condition: service_healthy

  # -------------------------------------------------- model-init (run once)
  # Warms ollama_models. Idempotent, re-running when warm is a no-op.
  #   docker compose --profile setup run --rm model-init
  model-init:
    image: ollama/ollama:latest
    profiles: ["setup"]
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull ${LLM_MODEL:-gemma3:4b} &&
       echo '--- models present ---' && ollama list"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama

volumes:
  hf_cache:       # embedding model weights
  emb_cache:      # computed corpus embeddings
  ollama_models:  # LLM weights
  pgdata:         # PostGIS data
  automl_models:  # trained AutoGluon predictors
